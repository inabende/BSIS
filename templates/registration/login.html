{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Log in</h1>
      <p class="text-muted small mb-4">Integrated Blood Smear System</p>
      {% if form.errors %}
        <div class="alert alert-danger py-2">Username or password is incorrect.</div>
      {% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Username</label>
          <input class="form-control" type="text" name="username" id="id_username" autofocus required value="{{ form.username.value|default:'' }}">
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Password</label>
          <input class="form-control" type="password" name="password" id="id_password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-brand w-100" type="submit">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
