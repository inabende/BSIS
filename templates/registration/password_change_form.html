{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card"><div class="card-body p-4">
      <h1 class="h4 mb-3">Change password</h1>
      <form method="post">{% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            <input class="form-control" type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" required>
            {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
            {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
          </div>
        {% endfor %}
        <button class="btn btn-brand" type="submit">Change password</button>
        <a class="btn btn-link" href="{% url 'home' %}">Cancel</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
